<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" role="img" aria-label="Deprecated: AWS SDK for Java v1 reached end-of-support on Dec 31, 2025. Use MATLAB AWS Support v2 (AWS SDK v2).">
  <title>Deprecated — AWS SDK for Java v1 EoS: Dec 31, 2025. Use MATLAB AWS Support v2.</title>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE169"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" rx="14" ry="14" width="884" height="104" fill="url(#grad)" filter="url(#shadow)"/>

  <!-- Left tab -->
  <rect x="16" y="26" rx="10" ry="10" width="210" height="68" fill="#111827"/>
  <text x="121" y="68" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, Verdana, sans-serif" font-weight="700" font-size="20" fill="#FDE68A">DEPRECATED</text>

  <!-- Warning icon -->
  <g transform="translate(248, 30)">
    <polygon points="20,0 40,34 0,34" fill="#B45309"/>
    <rect x="18.6" y="10" width="2.8" height="12" fill="#FEF3C7"/>
    <rect x="18.6" y="25" width="2.8" height="2.8" fill="#FEF3C7"/>
  </g>

  <!-- Main heading -->
  <text x="300" y="55" font-family="Segoe UI, DejaVu Sans, Verdana, sans-serif" font-size="22" font-weight="700" fill="#111827">
    Use MATLAB AWS Support v2 (AWS SDK for Java v2)
  </text>

  <!-- Subtitle -->
  <text x="300" y="100" font-family="Segoe UI, DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#1F2937">  
    <tspan x="300" dy="0">AWS SDK for Java v1 reached end‑of‑support on Dec 31, 2025.</tspan>
    <tspan x="300" dy="20">This repo is archived (no updates or fixes).</tspan> 
  </text>
</svg>
